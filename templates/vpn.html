<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
<title>VPN</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔐</text></svg>">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="container">
  <div class="header-flex">
    <div class="header-left">
      <a href="/" style="display:inline-block;margin-right:0.75rem;color:#00d9ff;text-decoration:none;font-size:1.5rem;">&larr;</a>
      <h1 style="margin:0;">VPN</h1>
    </div>
  </div>

  <div class="message" style="margin-top:1rem;">A VPN lets you browse safely from anywhere by sending your internet traffic through your home network.</div>

  <h2>Current Status</h2>
  <div class="data-table status-table">
    <table>
      <tbody id="status-rows">
        <tr><td colspan="2" style="text-align:center;color:#888;padding:1rem;"><span class="spinner"></span> Loading status...</td></tr>
      </tbody>
    </table>
  </div>

  <div id="vpn-form">
    <div class="loading"><span class="spinner"></span> Loading VPN settings...</div>
  </div>

  <div id="message" class="message"></div>

  <div style="margin-top:1.5rem;text-align:center;">
    <a href="/" class="nav-button" style="display:inline-block;padding:0.6rem 1.5rem;font-size:0.9rem;text-decoration:none;">🏠 Home</a>
  </div>
</div>

<script>
let vpn = null;
let peerClientConf = null;

function escapeHtml(str) {
  if (typeof str !== 'string') return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showMessage(text, type) {
  const msg = document.getElementById('message');
  msg.className = 'message ' + type + ' show';
  msg.textContent = text;
}

function connectedDot(ok) {
  return '<span class="status-dot ' + (ok ? 'connected' : 'disconnected') + '"></span>';
}

function formatHandshake(secs) {
  if (secs === null || secs === undefined) return 'no handshake yet';
  const s = parseInt(secs);
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  return Math.floor(s / 3600) + 'h ago';
}

function renderStatus(st) {
  const tbody = document.getElementById('status-rows');
  if (!st) {
    tbody.innerHTML = '<tr><td colspan="2" style="text-align:center;color:#888;">No VPN configured.</td></tr>';
    return;
  }
  const backendNames = {none:'Off', wireguard:'WireGuard', tailscale:'Tailscale'};
  const roleNames = {travel:'Travel box (goes with you)', home:'Home box (stays at home)'};
  const tsState = st.tailscale ? st.tailscale.state : '';
  const tsLine = tsState ? escapeHtml(st.tailscale.hostname || '') + ' ' + escapeHtml(st.tailscale.ip || '') + ' — ' + escapeHtml(tsState) : 'not running';
  const wgUp = st.wireguard && st.wireguard.iface_up;
  const hs = st.wireguard && st.wireguard.handshake_age_secs;
  const wgLine = wgUp
    ? (hs !== null && hs !== undefined
        ? 'Connected — ' + escapeHtml(st.wireguard.endpoint || '') + ' (' + formatHandshake(hs) + ')'
        : 'Interface up — waiting for first handshake')
    : 'not connected';
  const inst = st.installed || {};
  tbody.innerHTML =
    statusRow('VPN', '<strong>' + (backendNames[st.backend] || st.backend) + '</strong>') +
    statusRow('Role', '<strong>' + (roleNames[st.role] || st.role) + '</strong>') +
    statusRow('WireGuard', connectedDot(wgUp) + ' ' + wgLine) +
    statusRow('Tailscale', connectedDot(st.tailscale && tsState === 'Running') + ' ' + tsLine) +
    statusRow('VPN tools installed', ((inst.wg && inst.wg_quick) ? 'WireGuard ✓' : 'WireGuard ✗') + ' · ' + (inst.tailscale ? 'Tailscale ✓' : 'Tailscale ✗')) +
    statusRow('Kill switch', (st.kill_switch ? '<span class="status-value-warn">ON — traffic blocked until the VPN is connected</span>' : '<span class="status-value-ok">off</span>')) +
    (st.last_error ? '<tr><td colspan="2" style="color:#ff4444;font-size:0.85rem;padding:0.5rem;">⚠ ' + escapeHtml(st.last_error) + '</td></tr>' : '');
}

function statusRow(label, value, cls) {
  return '<tr><td>' + escapeHtml(label) + '</td><td' + (cls ? ' class="' + cls + '"' : '') + '>' + value + '</td></tr>';
}

function buildForm() {
  const isWG = vpn.backend === 'wireguard';
  const isTS = vpn.backend === 'tailscale';
  const isHome = vpn.role === 'home';
  const isTravel = vpn.role === 'travel';
  const peerRows = (vpn.wg_peers || []).map(function(p) {
    return '<tr><td><strong>' + escapeHtml(p.name) + '</strong></td><td style="font-size:0.75rem;">' + escapeHtml(p.public_key) + '</td><td>' + escapeHtml(p.tunnel_ip) + '</td><td><button class="red-button" onclick="removePeer(\'' + p.name.replace(/'/g, "\\'") + '\')">Remove</button></td></tr>';
  }).join('') || '<tr><td colspan="4" style="text-align:center;color:#888;">No travel devices added yet.</td></tr>';

  return `
    <h2>What is this box?</h2>
    <table class="form-table">
      <tr>
        <td>This device is...</td>
        <td>
          <label style="display:block;margin:0.25rem 0;"><input type="radio" name="role" value="travel"${isTravel ? ' checked' : ''} onchange="onRoleChange()"> <strong>Travel box</strong> — the small one that goes with you</label>
          <label style="display:block;margin:0.25rem 0;"><input type="radio" name="role" value="home"${isHome ? ' checked' : ''} onchange="onRoleChange()"> <strong>Home box</strong> — the one that stays at home</label>
        </td>
      </tr>
    </table>

    <h2>VPN Service</h2>
    <table class="form-table">
      <tr>
        <td>Backend</td>
        <td>
          <label style="display:block;margin:0.25rem 0;"><input type="radio" name="backend" value="none"${!isWG && !isTS ? ' checked' : ''} onchange="onBackendChange()"> <strong>Off</strong> — plain travel router</label>
          <label style="display:block;margin:0.25rem 0;"><input type="radio" name="backend" value="wireguard"${isWG ? ' checked' : ''} onchange="onBackendChange()"> <strong>WireGuard</strong> — your own private tunnel, no account needed</label>
          <label style="display:block;margin:0.25rem 0;"><input type="radio" name="backend" value="tailscale"${isTS ? ' checked' : ''} onchange="onBackendChange()"> <strong>Tailscale</strong> — easiest to set up (needs a free Tailscale account)</label>
        </td>
      </tr>
    </table>

    ${isTS ? tsSection(isHome) : ''}
    ${isWG ? wgSection(isHome, isTravel, peerRows) : ''}

    <h2>Tools</h2>
    <p style="color:#888;font-size:0.85rem;margin-bottom:0.5rem;">Install WireGuard and Tailscale on this box (needs internet). The services stay off until you save a VPN below.</p>
    <button class="ok-button" onclick="installTools()">Install VPN tools</button>

    <button id="save-btn" class="ok-button" onclick="saveConfig()" style="margin-top:0.75rem;display:block;width:100%;">Save &amp; Apply</button>
  `;
}

function tsSection(isHome) {
  return `
    <h2>Tailscale Settings</h2>
    <table class="form-table">
      <tr>
        <td>Auth key</td>
        <td>
          <input type="text" id="ts_auth_key" value="${escapeHtml(vpn.ts_auth_key || '')}" placeholder="tskey-auth-...">
          <div class="hint">Tailscale admin console → Settings → Keys → Generate auth key. Create a new one if yours expired.</div>
        </td>
      </tr>
      <tr>
        <td>Hostname</td>
        <td>
          <input type="text" id="ts_hostname" value="${escapeHtml(vpn.ts_hostname || '')}" placeholder="travel-box">
          <div class="hint">A friendly name for this device in your Tailscale network.</div>
        </td>
      </tr>
      ${isHome ? `
      <tr>
        <td>Advertise routes</td>
        <td>
          <input type="text" id="ts_advertise_routes" value="${escapeHtml(vpn.ts_advertise_routes || '')}" placeholder="192.168.1.0/24">
          <div class="hint">Optional: the home network you want travel devices to reach, e.g. 192.168.1.0/24. Approve it once in the Tailscale admin console (Machines → ⋮ → Edit route settings).</div>
        </td>
      </tr>` : `
      <tr>
        <td>Home node (exit node)</td>
        <td>
          <input type="text" id="ts_exit_node" value="${escapeHtml(vpn.ts_exit_node || '')}" placeholder="home-box">
          <div class="hint">The home box's hostname or IP in Tailscale. Set it as an exit node on the home box first, and approve it in the admin console.</div>
        </td>
      </tr>
      <tr>
        <td>Route all internet through home</td>
        <td>
          <label><input type="checkbox" id="ts_route_all"${vpn.ts_route_all ? ' checked' : ''}> Send ALL internet traffic through the home network (exit node)</label>
          <div class="hint">When off: only the home subnet (192.168.x.x) routes through Tailscale — internet goes direct. When on: everything goes through home.</div>
        </td>
      </tr>
      <tr>
        <td>Keep local network reachable</td>
        <td>
          <label><input type="checkbox" id="ts_allow_lan"${vpn.ts_allow_lan ? ' checked' : ''}> Allow the hotel / cafe network to stay reachable while tunnelled</label>
        </td>
      </tr>`}
    </table>
  `;
}

function wgSection(isHome, isTravel, peerRows) {
  return `
    <h2>WireGuard Settings</h2>
    <p style="color:#888;font-size:0.85rem;">WireGuard links two boxes directly over the internet. Set up the <strong>home box</strong> first, then use the travel box's page to connect to it.</p>

    ${isTravel ? `
    <h3>Fast setup: paste a config file</h3>
    <p style="color:#888;font-size:0.85rem;">If someone gave you a WireGuard config file (ends in .conf), paste it here and press Parse — it will fill in the fields below.</p>
    <textarea id="import_conf" rows="8" style="width:100%;box-sizing:border-box;font-family:monospace;font-size:0.8rem;" placeholder="[Interface]&#10;PrivateKey = ..."></textarea>
    <div style="display:flex;gap:0.5rem;margin-top:0.5rem;flex-wrap:wrap;">
      <button class="ok-button" onclick="parseConf()">Parse config file</button>
      <a href="/docs" style="display:none;"></a>
    </div>
    ` : `
    <h3>Travel devices</h3>
    <p style="color:#888;font-size:0.85rem;">Add each travel box here. Press "Add" — the home box creates its key automatically and shows a ready-to-paste config for the travel box.</p>
    <div style="display:flex;gap:0.5rem;margin-bottom:0.75rem;flex-wrap:wrap;">
      <input type="text" id="new_peer_name" placeholder="e.g. My travel box" style="flex:1;min-width:180px;">
      <button class="ok-button" onclick="addPeer()">Add travel device</button>
    </div>
    <div class="data-table">
      <table>
        <thead><tr><th>Name</th><th>Public key</th><th>Tunnel IP</th><th></th></tr></thead>
        <tbody>${peerRows}</tbody>
      </table>
    </div>
    <div id="client-conf-panel" class="hidden" style="margin-top:0.75rem;">
      <p style="color:#888;font-size:0.85rem;">Copy this whole config into the travel box (VPN page → Import a config file → Parse). This is the <strong>only time the private key is shown</strong>.</p>
      <textarea id="client_conf" rows="10" style="width:100%;box-sizing:border-box;font-family:monospace;font-size:0.8rem;" readonly></textarea>
      <button class="ok-button" onclick="copyClientConf()" style="margin-top:0.5rem;">Copy to clipboard</button>
    </div>
    `}

    <h3>Keys</h3>
    <table class="form-table">
      ${isTravel ? `
      <tr>
        <td>My private key</td>
        <td>
          <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
            <input type="text" id="wg_private_key" value="${escapeHtml(vpn.wg_private_key || '')}" readonly style="flex:1;min-width:200px;font-family:monospace;font-size:0.75rem;">
            <button class="ok-button" onclick="genKeys('client')">Generate my key</button>
          </div>
        </td>
      </tr>
      <tr>
        <td>Home box public key</td>
        <td><input type="text" id="wg_peer_public_key" value="${escapeHtml(vpn.wg_peer_public_key || '')}" placeholder="Base64 key from the home box"></td>
      </tr>` : `
      <tr>
        <td>Server private key</td>
        <td>
          <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
            <input type="text" id="wg_server_private_key" value="${escapeHtml(vpn.wg_server_private_key || '')}" readonly style="flex:1;min-width:200px;font-family:monospace;font-size:0.75rem;">
            <button class="ok-button" onclick="genKeys('server')">Generate server key</button>
          </div>
        </td>
      </tr>`}
      <tr>
        <td>Endpoint</td>
        <td>
          <input type="text" id="wg_endpoint" value="${escapeHtml(vpn.wg_endpoint || '')}" placeholder="${isHome ? 'myhome.example.com:51820 (your public address)' : 'myhome.example.com:51820'}">
          <div class="hint">${isHome ? 'The public address travel boxes use to reach this box. If it is behind a home router, forward UDP 51820 to this box.' : 'The home box address:port, e.g. myhome.example.com:51820.'}</div>
        </td>
      </tr>
      ${isHome ? `
      <tr>
        <td>Listen port</td>
        <td><input type="number" id="wg_listen_port" value="${vpn.wg_listen_port || 51820}" min="1" max="65535"></td>
      </tr>` : `
      <tr>
        <td>My tunnel address</td>
        <td><input type="text" id="wg_address" value="${escapeHtml(vpn.wg_address || '10.0.0.2/24')}" placeholder="10.0.0.2/24"></td>
      </tr>
      <tr>
        <td>DNS</td>
        <td><input type="text" id="wg_dns" value="${escapeHtml(vpn.wg_dns || '')}" placeholder="10.0.0.1 (optional)"></td>
      </tr>
      <tr>
        <td>Preshared key</td>
        <td><input type="text" id="wg_preshared_key" value="${escapeHtml(vpn.wg_preshared_key || '')}" placeholder="optional extra security key"></td>
      </tr>
      <tr>
        <td>Keepalive</td>
        <td><input type="number" id="wg_keepalive" value="${vpn.wg_keepalive || 25}" min="0" max="65535"></td>
      </tr>
      <tr>
        <td>Route all traffic</td>
        <td>
          <label><input type="checkbox" id="wg_route_all"${vpn.wg_route_all ? ' checked' : ''}> Send ALL internet traffic through home</label>
          <div class="hint">Recommended. Uncheck to only reach the home network over the tunnel.</div>
        </td>
      </tr>`}
    </table>

    ${isTravel ? `
    <details style="margin-top:1rem;">
      <summary style="cursor:pointer;color:#00d9ff;">My home side is an existing computer / Raspberry Pi (not this box) — show manual steps</summary>
      <div style="margin-top:0.75rem;color:#ccc;font-size:0.85rem;line-height:1.6;">
        <p>On the <strong>home computer</strong>, run these once (they do the same thing the home box does automatically):</p>
        <pre style="background:#1a1f2e;padding:0.75rem;border-radius:6px;overflow-x:auto;font-size:0.78rem;">sudo apt update && sudo apt install -y wireguard wireguard-tools
cd /tmp && umask 077
wg genkey | tee server_private.key | wg pubkey &gt; server_public.key</pre>
        <p>Create <strong>/etc/wireguard/wg0.conf</strong> (replace the parts in &lt;&gt;):</p>
        <pre style="background:#1a1f2e;padding:0.75rem;border-radius:6px;overflow-x:auto;font-size:0.78rem;">[Interface]
PrivateKey = &lt;paste contents of server_private.key&gt;
Address = 10.0.0.1/24
ListenPort = 51820

[Peer]
# My travel box
PublicKey = &lt;my travel box public key (generate it below)&gt;
AllowedIPs = 10.0.0.2/32</pre>
        <p>Start it (replace <strong>eth0</strong> with the internet interface):</p>
        <pre style="background:#1a1f2e;padding:0.75rem;border-radius:6px;overflow-x:auto;font-size:0.78rem;">sudo sysctl -w net.ipv4.ip_forward=1
echo "net.ipv4.ip_forward=1" | sudo tee -a /etc/sysctl.conf
sudo iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
sudo systemctl enable --now wg-quick@wg0</pre>
        <p>Then on <strong>this travel box</strong>: press <strong>Generate my key</strong> above, and paste this box's <strong>public key</strong> into the home computer's wg0.conf where it says "my travel box public key". Save below.</p>
      </div>
    </details>
    ` : ''}
  `;
}

function onRoleChange() {
  vpn.role = document.querySelector('input[name="role"]:checked').value;
  document.getElementById('vpn-form').innerHTML = buildForm();
}

function onBackendChange() {
  vpn.backend = document.querySelector('input[name="backend"]:checked').value;
  document.getElementById('vpn-form').innerHTML = buildForm();
}

function readFields() {
  const get = function(id) { const el = document.getElementById(id); return el ? el.value : ''; };
  const chk = function(id) { const el = document.getElementById(id); return el ? el.checked : false; };
  if (vpn.backend === 'tailscale') {
    vpn.ts_auth_key = get('ts_auth_key');
    vpn.ts_hostname = get('ts_hostname');
    vpn.ts_advertise_routes = get('ts_advertise_routes');
    vpn.ts_exit_node = get('ts_exit_node');
    vpn.ts_route_all = chk('ts_route_all');
    vpn.ts_allow_lan = chk('ts_allow_lan');
  }
  if (vpn.backend === 'wireguard') {
    vpn.wg_private_key = get('wg_private_key');
    vpn.wg_peer_public_key = get('wg_peer_public_key');
    vpn.wg_server_private_key = get('wg_server_private_key');
    vpn.wg_endpoint = get('wg_endpoint');
    vpn.wg_address = get('wg_address');
    vpn.wg_dns = get('wg_dns');
    vpn.wg_preshared_key = get('wg_preshared_key');
    vpn.wg_keepalive = parseInt(get('wg_keepalive')) || 25;
    vpn.wg_route_all = chk('wg_route_all');
    vpn.wg_listen_port = parseInt(get('wg_listen_port')) || 51820;
  }
}

async function saveConfig() {
  readFields();
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  btn.textContent = 'Applying...';
  showMessage('', '');
  try {
    const r = await fetch('/api/vpn', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({vpn: vpn}),
    });
    const data = await r.json();
    if (data.success) {
      showMessage('VPN settings saved. Applying in the background — status will refresh in 5 seconds...', 'success');
      setTimeout(() => {
        loadStatus();
        showMessage('VPN settings saved and applied. Check the status above.', 'success');
      }, 5000);
    } else {
      showMessage(data.error || 'Save failed', 'error');
    }
  } catch {
    showMessage('Connection error. Please try again.', 'error');
  }
  btn.disabled = false;
  btn.textContent = 'Save & Apply';
}

async function parseConf() {
  const conf = document.getElementById('import_conf').value;
  if (!conf.trim()) { showMessage('Paste a WireGuard config file first.', 'error'); return; }
  try {
    const r = await fetch('/api/vpn/import', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({conf: conf}),
    });
    const data = await r.json();
    if (!data.success) { showMessage(data.error || 'Parse failed', 'error'); return; }
    Object.assign(vpn, data.parsed);
    vpn.backend = 'wireguard';
    vpn.role = 'travel';
    showMessage('Config parsed! Review the fields below, then press Save & Apply.', 'info');
    document.getElementById('vpn-form').innerHTML = buildForm();
  } catch {
    showMessage('Connection error. Please try again.', 'error');
  }
}

async function genKeys(scope) {
  readFields();
  try {
    const r = await fetch('/api/vpn/genkeys', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({scope: scope}),
    });
    const data = await r.json();
    if (!data.success) { showMessage(data.error || 'Key generation failed', 'error'); return; }
    if (scope === 'server') {
      vpn.wg_server_private_key = data.private_key;
      vpn.wg_server_public_key = data.public_key;
    } else {
      vpn.wg_private_key = data.private_key;
      vpn.wg_peer_public_key = data.public_key;
    }
    showMessage('Keys generated.', 'info');
    document.getElementById('vpn-form').innerHTML = buildForm();
  } catch {
    showMessage('Connection error. Please try again.', 'error');
  }
}

async function addPeer() {
  const name = document.getElementById('new_peer_name').value.trim();
  if (!name) { showMessage('Enter a name for the travel device.', 'error'); return; }
  try {
    const r = await fetch('/api/vpn/peers', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action: 'add', name: name}),
    });
    const data = await r.json();
    if (!data.success) { showMessage(data.error || 'Add failed', 'error'); return; }
    const fresh = await (await fetch('/api/vpn')).json();
    vpn = fresh.config;
    peerClientConf = data.client_conf || null;
    showMessage('Travel device added.', 'success');
    document.getElementById('vpn-form').innerHTML = buildForm();
    if (peerClientConf) {
      const panel = document.getElementById('client-conf-panel');
      panel.classList.remove('hidden');
      document.getElementById('client_conf').value = peerClientConf;
      panel.scrollIntoView({behavior: 'smooth'});
    }
    loadStatus();
  } catch {
    showMessage('Connection error. Please try again.', 'error');
  }
}

async function removePeer(name) {
  if (!confirm('Remove "' + name + '"?')) return;
  try {
    const r = await fetch('/api/vpn/peers', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action: 'remove', name: name}),
    });
    const data = await r.json();
    if (!data.success) { showMessage(data.error || 'Remove failed', 'error'); return; }
    const fresh = await (await fetch('/api/vpn')).json();
    vpn = fresh.config;
    showMessage('Peer removed.', 'success');
    document.getElementById('vpn-form').innerHTML = buildForm();
    loadStatus();
  } catch {
    showMessage('Connection error. Please try again.', 'error');
  }
}

function copyClientConf() {
  const ta = document.getElementById('client_conf');
  ta.select();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(ta.value).then(function() {
      showMessage('Config copied. Paste it into the travel box (VPN page → Import a config file → Parse).', 'success');
    });
  } else {
    document.execCommand('copy');
    showMessage('Config copied. Paste it into the travel box (VPN page → Paste config file).', 'success');
  }
}

async function installTools() {
  showMessage('Installing VPN tools... this can take a minute.', 'info');
  try {
    const r = await fetch('/api/vpn/install', {method: 'POST'});
    const data = await r.json();
    if (data.success) {
      showMessage((data.logs || []).join(' · ') || 'Done.', 'success');
    } else {
      showMessage(data.error || 'Install failed', 'error');
    }
    loadStatus();
  } catch {
    showMessage('Connection error during install.', 'error');
  }
}

async function loadStatus() {
  try {
    const data = await (await fetch('/api/vpn')).json();
    renderStatus(data.status);
  } catch {}
}

async function load() {
  try {
    const data = await (await fetch('/api/vpn')).json();
    vpn = data.config;
    renderStatus(data.status);
    document.getElementById('vpn-form').innerHTML = buildForm();
  } catch {
    document.getElementById('vpn-form').innerHTML = '<div class="message error show">Failed to load VPN settings.</div>';
  }
}

load();
